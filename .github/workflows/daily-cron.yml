name: Daily Betting Analysis

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6:00 AM UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  run-daily-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily cron
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/daily")

          echo "HTTP Status: $response"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$response" != "200" ]; then
            echo "❌ Cron failed with status $response"
            exit 1
          fi

          echo "✅ Daily analysis completed successfully"
